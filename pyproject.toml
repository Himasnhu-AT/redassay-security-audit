[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "redassay"
version = "0.1.0"
description = "Deterministic security scanning with a human triage loop"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
dependencies = []

[project.scripts]
redassay = "redassay.cli:main"

[tool.setuptools]
package-dir = { "" = "engine" }

[tool.setuptools.packages.find]
where = ["engine"]

# redassay auditing itself. This block is the documented way to carry scan
# configuration in version control - .redassay/ holds review state and is not
# committed, so anything a teammate needs to reproduce the scan belongs here.
[tool.redassay]
min_severity = "low"
disabled_rules = [
  # Every board endpoint is a mutating route with no authorization decorator,
  # which is what the rule looks for. The board binds to loopback, has no
  # accounts, and treats the OS user as the principal - there is no
  # authorization layer to be missing. Documented in docs/architecture.md.
  "authz.missing-authorization-check",
]
